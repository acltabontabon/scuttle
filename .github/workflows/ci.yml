name: CI

on:
  push:
    branches: [main]
  pull_request:

# A filesystem utility gets tested on every filesystem it claims to support.
# Platform assumptions — case sensitivity, symlinks above home, where
# applications register themselves — differ in ways that only show up here.
jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  core:
    name: Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Lints
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # Includes the end-to-end suite over fixture filesystems: protected
      # paths, symlink loops, stale findings, quarantine and restore.
      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  bundle:
    name: Bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci

      # Proves the thing actually packages on both platforms. Unsigned here;
      # signing and notarisation are documented in docs/packaging.md.
      - name: Build installable artifact
        run: npm run app:build

      - uses: actions/upload-artifact@v4
        with:
          name: scuttle-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: ignore
