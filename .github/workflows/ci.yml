name: CI

# A filesystem utility gets tested on every filesystem it claims to support.
# Platform assumptions — case sensitivity, symlinks above home, where
# applications register themselves — differ in ways that only show up here.
#
# Release runs call this workflow before building anything, so a tag cannot
# produce downloads from a commit that would not have passed a pull request.

on:
  push:
    branches: [main]
    # The marketing site and the prose have their own workflow and their own
    # reviewers. Rebuilding two DMGs and a Windows installer because a
    # paragraph changed is fifteen minutes nobody asked for.
    paths-ignore:
      - 'www/**'
      - 'docs/**'
      - '**/*.md'
  # Pull requests are never filtered by path. A required check that is skipped
  # is reported as pending forever, which blocks exactly the documentation-only
  # pull request it was meant to make cheaper — and the expensive job here is
  # the packaging one, which pull requests do not run anyway.
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      package:
        description: Also build the installers. Off for release runs, which build them themselves.
        required: false
        default: true
        type: boolean

# Nothing here writes anything. The release workflow grants `contents: write`
# to exactly one job, and that job never runs on a pull request.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned rather than floating: a release is reproduced from a tag months
  # later, and "whatever was current" is not a thing you can go back to.
  NODE_VERSION: '26.8.2'
  RUST_TOOLCHAIN: '1.98.1'

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # Cheapest check first, and the one most likely to be wrong: the version
      # lives in five files and only one of them reaches the About screen.
      - name: Version is the same everywhere
        run: npm run version:check

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  core:
    name: Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          key: ${{ matrix.os }}

      # `tauri::generate_context!` reads `frontendDist` at compile time and
      # panics if it is not there, so even `cargo clippy` needs the frontend
      # to have been built. It costs a couple of seconds and it is the
      # difference between this job running and this job never having run.
      - run: npm ci
      - run: npm run build

      - name: Formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      # `--all-targets` compiles the library, the binary and every test on this
      # platform, which is the native-compilation check as well as the lint.
      - name: Lints
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # Includes the end-to-end suite over fixture filesystems: protected
      # paths, symlink loops, stale findings, quarantine and restore. Every
      # one of them builds its own temporary tree; none of them go near the
      # runner's home directory, and none of them delete anything outside it.
      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  package:
    name: Package
    # Packaging is a fifteen-minute release build per platform, and it fails
    # for reasons the checks above cannot see — a missing icon, a bundler
    # setting, a frontend that builds but does not load. Worth knowing on
    # main and on demand; not worth paying for on every push to a branch,
    # and not worth doing twice during a release, which builds its own.
    if: github.event_name != 'pull_request' && inputs.package != false
    needs: [frontend, core]
    uses: ./.github/workflows/build-desktop.yml
    with:
      ref: ${{ github.sha }}
