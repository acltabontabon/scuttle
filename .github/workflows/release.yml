name: Release

# One tag, one release, in four steps that each refuse to go on if the one
# before it did not hold:
#
#   validate  the tag, the version and the changelog agree, and the updater
#             is configured
#   checks    everything CI runs, on the tagged commit
#   build     three installers and their signed update packages, each
#             inspected where it was built
#   publish   a draft gathers the assets and the update manifest; it becomes a
#             release only once every expected file is present and every
#             signature has been checked against its file
#   channels  only then are installed copies pointed at it (update-channels.yml)
#
# The release is written last and all at once, so a half-finished run can
# never sit at the top of the releases page looking like the current version.
# The channel pointers move after that, so nobody is offered an update whose
# files are not yet public.
#
# Nothing here bumps a version or writes a commit. The tag is built exactly
# as it was pushed; if something is wrong with it, the fix is a new tag.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

concurrency:
  # Never two runs racing for the same tag; never cancelling one that might
  # be halfway through uploading.
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26.8.2'

      # Stopping here costs nothing; stopping after three builds costs half an
      # hour. The public key has to be a real one and the private key has to
      # exist, or the build below cannot produce a release anyone can update
      # from. Neither value is printed.
      - name: The updater is configured
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$KEY" ]; then
            echo '::error::TAURI_SIGNING_PRIVATE_KEY is not set as a repository secret. See docs/updates.md.'
            exit 1
          fi
          node scripts/update-manifest.mjs check-config

      - name: Tag, version and changelog agree
        id: check
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${TAG#v}"

          # Refuses a tag that does not match what the application will report
          # about itself — the one release mistake that cannot be fixed later.
          node scripts/version.mjs check "$TAG"

          # And a release nobody wrote down. The notes are built from this
          # section, so an empty one would publish an empty release.
          node scripts/release-notes.mjs "$version" > /dev/null

          # A rerun is expected and safe. Replacing binaries people have
          # already downloaded is neither, so a tag that is already published
          # stops here rather than quietly getting new contents.
          state=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft \
                    --jq 'if .isDraft then "draft" else "published" end' 2>/dev/null || echo none)
          case "$state" in
            published)
              echo "::error::$TAG is already published. Publish a new version rather than replacing a release people may already have downloaded."
              exit 1 ;;
            draft) echo "A draft for $TAG exists; this run will finish it." ;;
            none)  echo "No release for $TAG yet." ;;
          esac

          # v0.2.0-rc.1 and friends are marked as prereleases on GitHub too,
          # and never become the latest stable release.
          case "$TAG" in *-*) prerelease=true ;; *) prerelease=false ;; esac

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Releasing $version (prerelease: $prerelease)"

  checks:
    name: Checks
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      skip_package: true

  build:
    name: Build
    needs: [validate, checks]
    uses: ./.github/workflows/build-desktop.yml
    with:
      ref: ${{ github.ref_name }}
      updater: true
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  publish:
    name: Publish
    needs: [validate, build]
    runs-on: ubuntu-latest
    # The only job in any workflow here that can write to the repository, and
    # it runs only from a tag on this repository. No pull request reaches it.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26.8.2'

      - uses: actions/download-artifact@v8
        with:
          pattern: scuttle-*
          path: downloads
          merge-multiple: true

      - name: Every expected download is here
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          cd downloads
          missing=0
          # What people download, and what the in-app updater downloads. Each
          # update artifact travels with its signature: a release with an
          # artifact and no signature is a release the updater must not offer.
          for name in \
            "Scuttle-$VERSION-macos-apple-silicon.dmg" \
            "Scuttle-$VERSION-macos-intel.dmg" \
            "Scuttle-$VERSION-windows-x64-setup.exe" \
            "Scuttle-$VERSION-macos-apple-silicon.app.tar.gz" \
            "Scuttle-$VERSION-macos-intel.app.tar.gz"
          do
            for file in "$name" "$name.sha256"; do
              if [ -s "$file" ]; then
                printf '  ok   %s\n' "$file"
              else
                printf '  MISSING %s\n' "$file"
                missing=1
              fi
            done
          done
          for file in \
            "Scuttle-$VERSION-macos-apple-silicon.app.tar.gz.sig" \
            "Scuttle-$VERSION-macos-intel.app.tar.gz.sig" \
            "Scuttle-$VERSION-windows-x64-setup.exe.sig"
          do
            if [ -s "$file" ]; then
              printf '  ok   %s\n' "$file"
            else
              printf '  MISSING %s\n' "$file"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || {
            echo '::error::A requested download is missing. Nothing will be published.'
            exit 1
          }

          # One file listing every checksum, for the release body and for
          # anyone who would rather check them all at once.
          cat ./*.sha256 | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt
          # Re-checked here against the files that are about to be uploaded,
          # so a corrupted artifact transfer cannot reach the release.
          sha256sum -c SHA256SUMS.txt

      # The update manifest is built from the signatures that came out of the
      # builds and then checked against the artifacts themselves: the whole
      # matrix present, every address the one this release will have, every
      # signature made with the key that is compiled into the application,
      # bound to this version, and valid for the exact bytes about to be
      # uploaded. Nothing is created on GitHub until this passes.
      - name: Build and check the update manifest
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/update-manifest.mjs build "$VERSION" downloads > downloads/latest.json
          node scripts/update-manifest.mjs verify downloads/latest.json "$VERSION" --artifacts downloads
          cat downloads/latest.json

      - name: Write the release notes
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: node scripts/release-notes.mjs "$VERSION" downloads/SHA256SUMS.txt > release-notes.md

      # Assets go to a draft first. A draft is not on the releases page, is
      # not "latest", and cannot be downloaded by anyone who was not looking
      # for it — so a run that dies mid-upload leaves nothing half-published,
      # and the next run picks the same draft up.
      - name: Assemble the release as a draft
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "$TAG" \
              --notes-file release-notes.md \
              --prerelease="$PRERELEASE"
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md
          fi
          # --clobber so a rerun replaces a partial upload instead of failing
          # on it. Only ever a draft's assets: validate refuses a tag that is
          # already published.
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            downloads/Scuttle-* downloads/latest.json downloads/SHA256SUMS.txt

      - name: Publish
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          set -euo pipefail
          # `--latest` only for a stable release, and only now that every
          # asset is attached.
          if [ "$PRERELEASE" = 'true' ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --draft=false --prerelease=false --latest
          fi
          echo "Released: $(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url)"

  # The release is public and its files are reachable. Only now is anybody
  # pointed at it. If this fails the release stands and nobody is offered the
  # update yet; rerun it from the Actions tab (Update channels), which needs no
  # rebuild.
  channels:
    name: Point installed copies at it
    needs: [validate, publish]
    permissions:
      contents: write
    uses: ./.github/workflows/update-channels.yml
    with:
      tag: ${{ github.ref_name }}
