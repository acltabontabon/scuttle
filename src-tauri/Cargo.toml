[package]
name = "scuttle"
version = "0.1.0"
description = "Your computer leaves stuff everywhere. Scuttle finds it."
authors = ["Scuttle contributors"]
license = "Apache-2.0"
repository = "https://github.com/acltabontabon/scuttle"
edition = "2021"
rust-version = "1.82"

[lib]
name = "scuttle_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The tray has something behind it now: an opt-in, metadata-only background
# check, off by default. Without `background_mode` enabled none of it runs, and
# closing the window still quits.
tauri = { version = "2", features = ["tray-icon"] }
# One process per user: two Scuttles sharing one database and one drawer would
# make the operation gate a lie, since it is per-process.
tauri-plugin-single-instance = "2.4"
# A per-user login item. No installer, no service, no elevation.
tauri-plugin-autostart = "2.5"
# Ordinary notification permission, asked for only when notifications are
# turned on, and never required for anything else to work.
tauri-plugin-notification = "2.4"
# The official updater. Scuttle drives it from Rust only: the webview is given
# no updater permission, so the install gate stays on this side of the IPC.
tauri-plugin-updater = "2.12"
semver = "1"
# Timers for the update check only; the runtime itself is Tauri's.
tokio = { version = "1", default-features = false, features = ["time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
walkdir = "2"
blake3 = "1"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rayon = "1"
sysinfo = { version = "0.37", default-features = false, features = ["disk"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp"] }

[target.'cfg(unix)'.dependencies]
# `renameat2` / `renamex_np`: rename that refuses to replace its destination.
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55"
# Rename/delete through an open handle, file identity, and — for background
# checks — whether the machine is on mains power. `GetSystemPowerStatus` needs
# no permission and no elevation.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Power",
] }

[dev-dependencies]
tempfile = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# Unwind rather than abort: a panic on the move worker has to be caught so the
# operation gate is released and the run ends with a report, not a dead app.
panic = "unwind"
strip = true
