[package]
name = "scuttle"
version = "0.1.0-alpha.1"
description = "Your computer leaves stuff everywhere. Scuttle finds it."
authors = ["Scuttle contributors"]
license = "Apache-2.0"
repository = "https://github.com/acltabontabon/scuttle"
edition = "2021"
rust-version = "1.82"

[lib]
name = "scuttle_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# No tray in this version: ambient rummaging is not implemented, and a tray
# icon with nothing behind it is just a second place to close the app from.
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
walkdir = "2"
blake3 = "1"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rayon = "1"
sysinfo = { version = "0.37", default-features = false, features = ["disk"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp"] }

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55"

[dev-dependencies]
tempfile = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
